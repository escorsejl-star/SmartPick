<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo SKU - SmartPick</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="catalogo.css">
  <link rel="stylesheet" href="modal.css">
</head>
<body>

  <aside class="sidebar" id="menu"></aside>

  <div class="principal">

    <header class="topo">
      <h2>Catálogo SKU</h2>
      <div>
        <span id="data"></span>
        <span class="status">● Sistema Ativo</span>
      </div>
    </header>

    <div class="conteudo">

      <section class="lista">
        <div class="lista-topo">
          <h3>Catálogo SKUs <span class="contador" id="contador">8</span></h3>
          <input type="text" id="busca" placeholder="🔍 Buscar SKU...">
        </div>
        <div id="itens"></div>
      </section>

      <section class="detalhe">
        <div class="detalhe-topo">
          <div>
            <p class="codigo" id="d-codigo"></p>
            <h2 id="d-nome"></h2>
            <p class="categoria" id="d-categoria"></p>
          </div>
          <div class="botoes">
            <button class="btn-editar" id="btnExcluir">Excluir</button>
            <button class="btn-editar" id="btnEditar">Editar</button>
            <button class="btn-salvar" id="btnNovo">+ Novo</button>
          </div>
        </div>

        <div class="nivel" id="d-nivel"></div>

        <div class="grade">
          <div class="caixa">
            <h4>DIMENSÕES E PESO</h4>
            <div class="medidas">
              <div><b id="d-comp"></b><span>Comprimento</span></div>
              <div><b id="d-larg"></b><span>Largura</span></div>
              <div><b id="d-alt"></b><span>Altura</span></div>
              <div><b id="d-peso"></b><span>Peso</span></div>
            </div>
          </div>

          <div class="caixa">
            <h4>LOCALIZAÇÃO</h4>
            <small>Zona</small>
            <p class="zona" id="d-zona"></p>
            <small>Endereço</small>
            <p class="endereco" id="d-endereco"></p>
            <div class="etiquetas" id="d-etiquetas"></div>
          </div>

          <div class="caixa">
            <h4>CÓDIGO DE BARRAS (EAN-13)</h4>
            <div class="barras" id="d-barras"></div>
            <p class="ean" id="d-ean"></p>
          </div>

          <div class="caixa">
            <h4>NÍVEL DE ESTOQUE</h4>
            <p class="qtd" id="d-qtd"></p>
            <div class="estoque-linha">
              <span>unidades</span>
              <span>Mínimo: <b id="d-min"></b></span>
            </div>
            <div class="barra-fundo"><div class="barra-cheia" id="d-barra"></div></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="modal-fundo" id="modalFundo" hidden>
    <form class="modal" id="formProduto" novalidate>
      <h3 id="modalTitulo">Editar produto</h3>
      <div class="modal-grade">
        <div><label for="f-codigo">Código (SKU)</label><input id="f-codigo" maxlength="20"></div>
        <div><label for="f-categoria">Categoria</label><input id="f-categoria" maxlength="50"></div>
        <div class="inteiro"><label for="f-descricao">Nome</label><input id="f-descricao" maxlength="100"></div>
        <div><label for="f-quantidade">Quantidade</label><input id="f-quantidade" type="number" min="0"></div>
        <div><label for="f-minimo">Estoque mínimo</label><input id="f-minimo" type="number" min="0"></div>
        <div><label for="f-peso">Peso (kg)</label><input id="f-peso" type="number" step="0.01" min="0"></div>
        <div><label for="f-ean">EAN (13 números)</label><input id="f-ean" maxlength="13"></div>
        <div><label for="f-comp">Comprimento (cm)</label><input id="f-comp" type="number" step="0.01" min="0"></div>
        <div><label for="f-larg">Largura (cm)</label><input id="f-larg" type="number" step="0.01" min="0"></div>
        <div><label for="f-alt">Altura (cm)</label><input id="f-alt" type="number" step="0.01" min="0"></div>
      </div>
      <p class="modal-erro" id="modalErro" hidden></p>
      <div class="modal-botoes">
        <span class="espaco"></span>
        <button type="button" class="btn-modal-cancelar" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn-modal-salvar">Salvar</button>
      </div>
    </form>
  </div>

  <script src="menu.js"></script>
  <script src="catalogo.js"></script>
</body>
</html>
