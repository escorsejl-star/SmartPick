<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo SKU - SmartPick</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="catalogo.css">
</head>
<body>

  <aside class="sidebar" id="menu"></aside>

  <div class="principal">

    <header class="topo">
      <h2>Catálogo SKU</h2>
      <div>
        <span id="data"></span>
        <span class="status">● Sistema Ativo</span>
      </div>
    </header>

    <div class="conteudo">

      <section class="lista">
        <div class="lista-topo">
          <h3>Catálogo SKUs <span class="contador" id="contador">8</span></h3>
          <input type="text" id="busca" placeholder="🔍 Buscar SKU...">
        </div>
        <div id="itens"></div>
      </section>

      <section class="detalhe">
        <div class="detalhe-topo">
          <div>
            <p class="codigo" id="d-codigo"></p>
            <h2 id="d-nome"></h2>
            <p class="categoria" id="d-categoria"></p>
          </div>
          <div class="botoes">
            <button class="btn-editar" id="btnEditar">Editar</button>
            <button class="btn-salvar" id="btnSalvar">Salvar</button>
          </div>
        </div>

        <div class="nivel" id="d-nivel"></div>

        <div class="grade">
          <div class="caixa">
            <h4>DIMENSÕES E PESO</h4>
            <div class="medidas">
              <div><b id="d-comp"></b><span>Comprimento</span></div>
              <div><b id="d-larg"></b><span>Largura</span></div>
              <div><b id="d-alt"></b><span>Altura</span></div>
              <div><b id="d-peso"></b><span>Peso</span></div>
            </div>
          </div>

          <div class="caixa">
            <h4>LOCALIZAÇÃO</h4>
            <small>Zona</small>
            <p class="zona" id="d-zona"></p>
            <small>Endereço</small>
            <p class="endereco" id="d-endereco"></p>
            <div class="etiquetas" id="d-etiquetas"></div>
          </div>

          <div class="caixa">
            <h4>CÓDIGO DE BARRAS (EAN-13)</h4>
            <div class="barras" id="d-barras"></div>
            <p class="ean" id="d-ean"></p>
          </div>

          <div class="caixa">
            <h4>NÍVEL DE ESTOQUE</h4>
            <p class="qtd" id="d-qtd"></p>
            <div class="estoque-linha">
              <span>unidades</span>
              <span>Mínimo: <b id="d-min"></b></span>
            </div>
            <div class="barra-fundo"><div class="barra-cheia" id="d-barra"></div></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="menu.js"></script>
  <script src="catalogo.js"></script>
</body>
</html>
